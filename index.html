<!DOCTYPE html>
<html lang="no" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sporia – Hundehelse & Logg</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- FontAwesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            appleBg: '#F5F5F7',
            appleCard: '#FFFFFF',
            appleText: '#1D1D1F',
            appleSub: '#86868B',
            appleBlue: '#0071E3',
            appleBlueHover: '#0077ED',
            appleGray: '#E5E5EA',
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #F5F5F7;
      color: #1D1D1F;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.4);
    }
    /* Skjul rullende bar for penere horisontal meny */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="h-full flex flex-col justify-between selection:bg-appleBlue selection:text-white pb-24">

  <!-- TOP HEADER MED HUNDEVELGER / PROFILER -->
  <header class="sticky top-0 z-50 glass-card border-b border-gray-200/60 px-4 py-3 space-y-3">
    <div class="flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <div class="w-8 h-8 rounded-full bg-appleBlue flex items-center justify-center text-white font-semibold shadow-sm">
          <i class="fa-solid fa-paw text-sm"></i>
        </div>
        <h1 class="text-lg font-semibold tracking-tight text-appleText">Sporia</h1>
      </div>
      <div id="connection-status" class="flex items-center space-x-1.5 text-xs font-medium px-2.5 py-1 rounded-full bg-emerald-100 text-emerald-800">
        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
        <span id="status-text">Koblet til</span>
      </div>
    </div>

    <!-- HORISONTAL HUNDEVELGER / PROFILER I TOPPEN -->
    <div class="flex items-center space-x-3 overflow-x-auto no-scrollbar pt-1 pb-1" id="header-dogs-container">
      <div class="text-xs text-appleSub py-1">Laster hundeprofiler...</div>
    </div>
  </header>

  <!-- MAIN CONTENT CONTAINER -->
  <main class="flex-1 max-w-xl w-full mx-auto p-4 space-y-6">

    <!-- DASHBOARD OVERVIEW -->
    <section class="grid grid-cols-2 gap-4">
      <div class="glass-card p-4 rounded-2xl shadow-sm border border-gray-100 flex flex-col justify-between">
        <span class="text-xs font-medium text-appleSub uppercase tracking-wider">Registrerte hunder</span>
        <div class="flex items-baseline justify-between mt-2">
          <span id="dog-count" class="text-3xl font-bold tracking-tight text-appleText">0</span>
          <i class="fa-solid fa-dog text-appleBlue/20 text-2xl"></i>
        </div>
      </div>
      <div class="glass-card p-4 rounded-2xl shadow-sm border border-gray-100 flex flex-col justify-between">
        <span class="text-xs font-medium text-appleSub uppercase tracking-wider">Helselogger</span>
        <div class="flex items-baseline justify-between mt-2">
          <span id="log-count" class="text-3xl font-bold tracking-tight text-appleText">0</span>
          <i class="fa-solid fa-notes-medical text-appleBlue/20 text-2xl"></i>
        </div>
      </div>
    </section>

    <!-- HEALTH LOGS SECTION -->
    <section class="glass-card rounded-2xl p-5 shadow-sm border border-gray-100 space-y-4">
      <div class="flex items-center justify-between">
        <h2 class="text-base font-semibold text-appleText">Siste helselogger</h2>
        <button onclick="openAddLogModal()" class="text-xs font-medium bg-appleBlue text-white px-3 py-1.5 rounded-full hover:bg-appleBlueHover transition active:scale-95 shadow-sm">
          <i class="fa-solid fa-plus mr-1"></i> Ny logg
        </button>
      </div>
      
      <!-- Logs List -->
      <div id="logs-container" class="space-y-3">
        <div class="text-center py-6 text-appleSub text-sm">Laster logger...</div>
      </div>
    </section>

  </main>

  <!-- MODAL: DOG PROFILE / DETAILS -->
  <div id="dog-profile-modal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="glass-card w-full sm:max-w-md rounded-t-3xl sm:rounded-2xl p-6 shadow-2xl border border-gray-200 space-y-4 animate-in fade-in slide-in-from-bottom duration-200">
      <div class="flex items-center justify-between">
        <div class="flex items-center space-x-3">
          <div id="profile-modal-avatar" class="w-12 h-12 rounded-full bg-appleBlue text-white flex items-center justify-center font-bold text-lg shadow-sm">
            H
          </div>
          <div>
            <h3 id="profile-modal-name" class="text-lg font-semibold text-appleText">Hundens navn</h3>
            <p id="profile-modal-breed" class="text-xs text-appleSub">Rase</p>
          </div>
        </div>
        <button onclick="closeDogProfileModal()" class="w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center text-appleSub hover:bg-gray-200">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      
      <div class="bg-white/60 p-4 rounded-xl border border-gray-100 space-y-2 text-sm">
        <div class="flex justify-between py-1 border-b border-gray-100">
          <span class="text-appleSub">Fødselsdato:</span>
          <span id="profile-modal-dob" class="font-medium text-appleText">-</span>
        </div>
      </div>

      <div class="pt-2 flex space-x-3">
        <button onclick="deleteCurrentDogProfile()" class="flex-1 py-2.5 bg-rose-50 text-rose-600 font-medium rounded-xl hover:bg-rose-100 transition text-sm">
          Slett hund
        </button>
        <button onclick="closeDogProfileModal()" class="flex-1 py-2.5 bg-gray-100 text-appleText font-medium rounded-xl hover:bg-gray-200 transition text-sm">
          Lukk
        </button>
      </div>
    </div>
  </div>

  <!-- MODAL: ADD DOG -->
  <div id="dog-modal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="glass-card w-full sm:max-w-md rounded-t-3xl sm:rounded-2xl p-6 shadow-2xl border border-gray-200 space-y-4 animate-in fade-in slide-in-from-bottom duration-200">
      <div class="flex items-center justify-between">
        <h3 class="text-lg font-semibold text-appleText">Legg til ny hund</h3>
        <button onclick="closeAddDogModal()" class="w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center text-appleSub hover:bg-gray-200">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      <form id="dog-form" onsubmit="handleDogSubmit(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-medium text-appleSub mb-1">Hundens navn</label>
          <input type="text" id="dog-name" required class="w-full px-3.5 py-2.5 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-appleBlue bg-white text-sm" placeholder="F.eks. Penny">
        </div>
        <div>
          <label class="block text-xs font-medium text-appleSub mb-1">Rase</label>
          <input type="text" id="dog-breed" required class="w-full px-3.5 py-2.5 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-appleBlue bg-white text-sm" placeholder="F.eks. Miniature American Shepherd">
        </div>
        <div>
          <label class="block text-xs font-medium text-appleSub mb-1">Fødselsdato</label>
          <input type="date" id="dog-dob" class="w-full px-3.5 py-2.5 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-appleBlue bg-white text-sm">
        </div>
        <button type="submit" class="w-full py-3 bg-appleBlue text-white font-medium rounded-xl hover:bg-appleBlueHover transition shadow-sm active:scale-98">
          Lagre hund
        </button>
      </form>
    </div>
  </div>

  <!-- MODAL: ADD HEALTH LOG -->
  <div id="log-modal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="glass-card w-full sm:max-w-md rounded-t-3xl sm:rounded-2xl p-6 shadow-2xl border border-gray-200 space-y-4 animate-in fade-in slide-in-from-bottom duration-200">
      <div class="flex items-center justify-between">
        <h3 class="text-lg font-semibold text-appleText">Ny helselogg</h3>
        <button onclick="closeAddLogModal()" class="w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center text-appleSub hover:bg-gray-200">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      <form id="log-form" onsubmit="handleLogSubmit(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-medium text-appleSub mb-1">Velg hund</label>
          <select id="log-dog-select" required class="w-full px-3.5 py-2.5 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-appleBlue bg-white text-sm">
            <option value="">Laster hunder...</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-medium text-appleSub mb-1">Tittel / Hendelse</label>
          <input type="text" id="log-title" required class="w-full px-3.5 py-2.5 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-appleBlue bg-white text-sm" placeholder="F.eks. Vaksine eller Vektkontroll">
        </div>
        <div>
          <label class="block text-xs font-medium text-appleSub mb-1">Notater</label>
          <textarea id="log-notes" rows="3" class="w-full px-3.5 py-2.5 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-appleBlue bg-white text-sm" placeholder="Detaljer om hendelsen..."></textarea>
        </div>
        <button type="submit" class="w-full py-3 bg-appleBlue text-white font-medium rounded-xl hover:bg-appleBlueHover transition shadow-sm active:scale-98">
          Lagre logg
        </button>
      </form>
    </div>
  </div>

  <!-- NAVIGATION BAR (Mobile Style) -->
  <nav class="fixed bottom-0 left-0 right-0 glass-card border-t border-gray-200/60 py-2.5 px-6 flex justify-around items-center z-40 max-w-xl mx-auto">
    <button onclick="window.scrollTo({top: 0, behavior: 'smooth'})" class="flex flex-col items-center text-appleBlue">
      <i class="fa-solid fa-house text-lg"></i>
      <span class="text-[10px] font-medium mt-0.5">Hjem</span>
    </button>
    <button onclick="openAddDogModal()" class="flex flex-col items-center text-appleSub hover:text-appleBlue transition">
      <i class="fa-solid fa-dog text-lg"></i>
      <span class="text-[10px] font-medium mt-0.5">Ny hund</span>
    </button>
    <button onclick="openAddLogModal()" class="flex flex-col items-center text-appleSub hover:text-appleBlue transition">
      <i class="fa-solid fa-notes-medical text-lg"></i>
      <span class="text-[10px] font-medium mt-0.5">Ny logg</span>
    </button>
  </nav>

  <!-- SUPABASE INITIALIZATION & APP LOGIC -->
  <script>
    const SUPABASE_URL = 'https://fhorhcvylrrzkstcggcc.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_SYWW9tfgXUgqBt89h3BjOw_eh_rpw5O';

    let supabaseClient = null;
    let cachedDogs = [];
    let activeDogIdForModal = null;

    try {
      supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      document.getElementById('status-text').textContent = 'Koblet til';
      document.getElementById('connection-status').className = 'flex items-center space-x-1.5 text-xs font-medium px-2.5 py-1 rounded-full bg-emerald-100 text-emerald-800';
    } catch (err) {
      document.getElementById('status-text').textContent = 'Tilkoblingsfeil';
      document.getElementById('connection-status').className = 'flex items-center space-x-1.5 text-xs font-medium px-2.5 py-1 rounded-full bg-rose-100 text-rose-800';
    }

    window.addEventListener('DOMContentLoaded', () => {
      loadData();
    });

    async function loadData() {
      if (!supabaseClient) return;
      await Promise.all([fetchDogs(), fetchLogs()]);
    }

    async function fetchDogs() {
      const headerContainer = document.getElementById('header-dogs-container');
      const select = document.getElementById('log-dog-select');
      
      const { data, error } = await supabaseClient.from('dogs').select('*').order('created_at', { ascending: false });
      
      if (error) {
        headerContainer.innerHTML = `<div class="text-xs text-rose-500">Kunne ikke laste hunder</div>`;
        return;
      }

      cachedDogs = data || [];
      document.getElementById('dog-count').textContent = cachedDogs.length;

      if (cachedDogs.length === 0) {
        headerContainer.innerHTML = `
          <button onclick="openAddDogModal()" class="flex items-center space-x-2 bg-white/80 border border-dashed border-gray-300 rounded-full px-3 py-1 text-xs text-appleSub hover:border-appleBlue hover:text-appleBlue transition">
            <i class="fa-solid fa-plus"></i>
            <span>Legg til hund</span>
          </button>
        `;
        select.innerHTML = `<option value="">Ingen hunder tilgjengelig</option>`;
        return;
      }

      // Generer runde profilavatarer i toppen + "Legg til ny"-knapp bakerst
      headerContainer.innerHTML = cachedDogs.map(dog => `
        <button onclick="openDogProfile('${dog.id}')" class="flex flex-col items-center space-y-1 group focus:outline-none shrink-0">
          <div class="w-11 h-11 rounded-full bg-gradient-to-tr from-appleBlue to-blue-400 text-white flex items-center justify-center font-bold text-sm shadow-sm ring-2 ring-white group-hover:scale-105 transition">
            ${dog.name.charAt(0).toUpperCase()}
          </div>
          <span class="text-[11px] font-medium text-appleText max-w-[60px] truncate">${escapeHtml(dog.name)}</span>
        </button>
      `).join('') + `
        <button onclick="openAddDogModal()" class="flex flex-col items-center space-y-1 group focus:outline-none shrink-0 ml-1">
          <div class="w-11 h-11 rounded-full bg-gray-200 text-appleSub flex items-center justify-center text-sm shadow-sm ring-2 ring-white group-hover:bg-gray-300 transition">
            <i class="fa-solid fa-plus"></i>
          </div>
          <span class="text-[11px] font-medium text-appleSub">Ny</span>
        </button>
      `;

      select.innerHTML = '<option value="">Velg hund...</option>' + cachedDogs.map(dog => `
        <option value="${dog.id}">${escapeHtml(dog.name)}</option>
      `).join('');
    }

    async function fetchLogs() {
      const container = document.getElementById('logs-container');
      
      const { data, error } = await supabaseClient
        .from('health_logs')
        .select('*, dogs(name)')
        .order('created_at', { ascending: false })
        .limit(10);
      
      if (error) {
        container.innerHTML = `<div class="text-center py-4 text-rose-500 text-xs">Kunne ikke laste logger</div>`;
        return;
      }

      document.getElementById('log-count').textContent = data ? data.length : 0;

      if (!data || data.length === 0) {
        container.innerHTML = `<div class="text-center py-4 text-appleSub text-xs">Ingen helselogger registrert ennå.</div>`;
        return;
      }

      container.innerHTML = data.map(log => `
        <div class="p-3 rounded-xl bg-white/60 border border-gray-100 shadow-2xs space-y-1">
          <div class="flex items-center justify-between">
            <span class="text-xs font-semibold text-appleBlue">${escapeHtml(log.dogs?.name || 'Ukjent hund')}</span>
            <span class="text-[10px] text-appleSub">${new Date(log.created_at).toLocaleDateString('no-NO')}</span>
          </div>
          <h4 class="text-sm font-medium text-appleText">${escapeHtml(log.title)}</h4>
          ${log.notes ? `<p class="text-xs text-appleSub">${escapeHtml(log.notes)}</p>` : ''}
        </div>
      `).join('');
    }

    // Modal Controls for Dog Profile
    function openDogProfile(dogId) {
      const dog = cachedDogs.find(d => d.id === dogId);
      if (!dog) return;

      activeDogIdForModal = dog.id;
      document.getElementById('profile-modal-name').textContent = dog.name;
      document.getElementById('profile-modal-breed').textContent = dog.breed || 'Ukjent rase';
      document.getElementById('profile-modal-dob').textContent = dog.dob ? new Date(dog.dob).toLocaleDateString('no-NO') : 'Ikke oppgitt';
      document.getElementById('profile-modal-avatar').textContent = dog.name.charAt(0).toUpperCase();

      document.getElementById('dog-profile-modal').classList.remove('hidden');
    }

    function closeDogProfileModal() {
      document.getElementById('dog-profile-modal').classList.add('hidden');
      activeDogIdForModal = null;
    }

    async function deleteCurrentDogProfile() {
      if (!activeDogIdForModal) return;
      if (!confirm('Er du sikker på at du vil slette denne hunden? Alle tilknyttede logger kan bli påvirket.')) return;
      
      const { error } = await supabaseClient.from('dogs').delete().eq('id', activeDogIdForModal);
      if (error) {
        alert('Feil ved sletting: ' + error.message);
        return;
      }

      closeDogProfileModal();
      loadData();
    }

    // Modal Controls
    function openAddDogModal() { document.getElementById('dog-modal').classList.remove('hidden'); }
    function closeAddDogModal() { document.getElementById('dog-modal').classList.add('hidden'); document.getElementById('dog-form').reset(); }
    
    function openAddLogModal() { document.getElementById('log-modal').classList.remove('hidden'); }
    function closeAddLogModal() { document.getElementById('log-modal').classList.add('hidden'); document.getElementById('log-form').reset(); }

    // Form Submissions
    async function handleDogSubmit(e) {
      e.preventDefault();
      const name = document.getElementById('dog-name').value;
      const breed = document.getElementById('dog-breed').value;
      const dob = document.getElementById('dog-dob').value || null;

      const { error } = await supabaseClient.from('dogs').insert([{ name, breed, dob }]);
      if (error) {
        alert('Feil ved lagring av hund: ' + error.message);
        return;
      }

      closeAddDogModal();
      loadData();
    }

    async function handleLogSubmit(e) {
      e.preventDefault();
      const dog_id = document.getElementById('log-dog-select').value;
      const title = document.getElementById('log-title').value;
      const notes = document.getElementById('log-notes').value;

      const { error } = await supabaseClient.from('health_logs').insert([{ dog_id, title, notes }]);
      if (error) {
        alert('Feil ved lagring av logg: ' + error.message);
        return;
      }

      closeAddLogModal();
      loadData();
    }

    function escapeHtml(str) {
      return str ? str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;") : '';
    }
  </script>
</body>
</html>
