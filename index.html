<!DOCTYPE html>
<html lang="no" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sporia</title>
  
  <!-- PWA & Mobile settings -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#db2777">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Sporia">
  <link rel="apple-touch-icon" href="icon-192.png">

  <!-- Tailwind CSS + DaisyUI -->
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4.7.2/dist/full.min.css" rel="stylesheet" type="text/css" />
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Inter Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
  </style>
</head>
<body class="bg-slate-50 min-h-screen p-4 md:p-8">

  <main class="max-w-md mx-auto space-y-6">
    
    <!-- Tittel -->
    <header class="text-center py-2">
      <h1 class="text-2xl font-bold tracking-tight text-slate-900">Sporia</h1>
      <p class="text-sm text-slate-500 mt-1">Registrer og hold oversikt over hundene dine</p>
    </header>

    <!-- Skjema for registrering -->
    <section class="card bg-white shadow-sm border border-slate-200 p-6 rounded-2xl">
      <h2 class="text-lg font-semibold text-slate-900 mb-4">Legg til ny hund</h2>
      
      <form id="dogForm" class="space-y-4">
        <div>
          <label class="label text-xs font-semibold text-slate-600 uppercase">Navn *</label>
          <input type="text" id="name" required class="input input-bordered w-full rounded-xl focus:outline-none focus:border-pink-600" placeholder="Eks. Bella" />
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="label text-xs font-semibold text-slate-600 uppercase">Rase</label>
            <input type="text" id="breed" class="input input-bordered w-full rounded-xl" placeholder="Eks. Golden Retriever" />
          </div>
          <div>
            <label class="label text-xs font-semibold text-slate-600 uppercase">Vekt (kg)</label>
            <input type="number" step="0.1" id="weight_kg" class="input input-bordered w-full rounded-xl" placeholder="Eks. 12.5" />
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="label text-xs font-semibold text-slate-600 uppercase">Fødselsdato</label>
            <input type="date" id="birth_date" class="input input-bordered w-full rounded-xl" />
          </div>
          <div>
            <label class="label text-xs font-semibold text-slate-600 uppercase">Kjønn</label>
            <select id="gender" class="select select-bordered w-full rounded-xl">
              <option value="">Velg...</option>
              <option value="Han">Han</option>
              <option value="Hun">Hun</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="label text-xs font-semibold text-slate-600 uppercase">Chip-nummer</label>
            <input type="text" id="chip_number" class="input input-bordered w-full rounded-xl" placeholder="Eks. 5780..." />
          </div>
          <div>
            <label class="label text-xs font-semibold text-slate-600 uppercase">Reg. nummer</label>
            <input type="text" id="reg_number" class="input input-bordered w-full rounded-xl" placeholder="Eks. NO12345/22" />
          </div>
        </div>

        <button type="submit" id="saveBtn" class="btn w-full bg-pink-600 hover:bg-pink-700 text-white font-medium rounded-xl border-none mt-2">
          Lagre hund
        </button>
      </form>

      <!-- Tilbakemelding til bruker -->
      <div id="statusMessage" class="hidden mt-4 alert text-sm py-2 rounded-xl"></div>
    </section>

    <!-- Liste over registrerte hunder -->
    <section>
      <h2 class="text-lg font-semibold text-slate-900 mb-3">Registrerte hunder</h2>
      <div id="dogList" class="space-y-3">
        <!-- Hundene legges inn her dynamisk -->
      </div>
    </section>

  </main>

  <!-- Modal for Redigering -->
  <dialog id="editModal" class="modal">
    <div class="modal-box rounded-2xl bg-white max-w-md">
      <h3 class="font-bold text-lg text-slate-900 mb-4">Rediger hund</h3>
      <form id="editDogForm" class="space-y-4">
        <input type="hidden" id="edit_id" />
        <div>
          <label class="label text-xs font-semibold text-slate-600 uppercase">Navn *</label>
          <input type="text" id="edit_name" required class="input input-bordered w-full rounded-xl" />
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="label text-xs font-semibold text-slate-600 uppercase">Rase</label>
            <input type="text" id="edit_breed" class="input input-bordered w-full rounded-xl" />
          </div>
          <div>
            <label class="label text-xs font-semibold text-slate-600 uppercase">Vekt (kg)</label>
            <input type="number" step="0.1" id="edit_weight_kg" class="input input-bordered w-full rounded-xl" />
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="label text-xs font-semibold text-slate-600 uppercase">Fødselsdato</label>
            <input type="date" id="edit_birth_date" class="input input-bordered w-full rounded-xl" />
          </div>
          <div>
            <label class="label text-xs font-semibold text-slate-600 uppercase">Kjønn</label>
            <select id="edit_gender" class="select select-bordered w-full rounded-xl">
              <option value="">Velg...</option>
              <option value="Han">Han</option>
              <option value="Hun">Hun</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="label text-xs font-semibold text-slate-600 uppercase">Chip-nummer</label>
            <input type="text" id="edit_chip_number" class="input input-bordered w-full rounded-xl" />
          </div>
          <div>
            <label class="label text-xs font-semibold text-slate-600 uppercase">Reg. nummer</label>
            <input type="text" id="edit_reg_number" class="input input-bordered w-full rounded-xl" />
          </div>
        </div>

        <div class="modal-action">
          <button type="button" onclick="document.getElementById('editModal').close()" class="btn btn-ghost rounded-xl">Avbryt</button>
          <button type="submit" class="btn bg-pink-600 hover:bg-pink-700 text-white rounded-xl border-none">Oppdater</button>
        </div>
      </form>
    </div>
  </dialog>

  <script>
    const SUPABASE_URL = 'https://fhorhcvylrrzkstcggcc.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_SYWW9tfgXUgqBt89h3BjOw_eh_rpw5O';
    
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentDogs = [];

    // HENTE OG VISE HUNDER
    async function loadDogs() {
      const dogList = document.getElementById('dogList');
      
      const { data: dogs, error } = await supabaseClient
        .from('dogs')
        .select('*');

      if (error) {
        console.error('Feil ved henting av hunder:', error);
        dogList.innerHTML = `<p class="text-sm text-red-500 text-center py-4">Feil ved henting: ${error.message}</p>`;
        return;
      }

      currentDogs = dogs || [];
      dogList.innerHTML = '';

      if (currentDogs.length === 0) {
        dogList.innerHTML = `<p class="text-sm text-slate-400 text-center py-4">Ingen hunder registrert ennå</p>`;
        return;
      }

      currentDogs.forEach(dog => {
        const card = document.createElement('div');
        card.className = 'card bg-white shadow-sm border border-slate-200 p-4 rounded-xl space-y-3';
        card.innerHTML = `
          <div class="flex justify-between items-start">
            <div>
              <h3 class="font-bold text-slate-900 text-base">${dog.name}</h3>
              <p class="text-xs text-slate-500 mt-0.5">
                ${dog.breed ? dog.breed : 'Ukjent rase'} 
                ${dog.gender ? '• ' + dog.gender : ''}
              </p>
            </div>
            ${dog.weight_kg ? `<span class="badge badge-ghost text-xs">${dog.weight_kg} kg</span>` : ''}
          </div>
          
          <div class="flex justify-end gap-2 pt-2 border-t border-slate-100">
            <button onclick="openEditModal(${dog.id})" class="btn btn-xs btn-ghost text-slate-600 hover:bg-slate-100 rounded-lg">
              Rediger
            </button>
            <button onclick="deleteDog(${dog.id}, '${dog.name}')" class="btn btn-xs btn-ghost text-red-600 hover:bg-red-50 rounded-lg">
              Slett
            </button>
          </div>
        `;
        dogList.appendChild(card);
      });
    }

    // LAGRE NY HUND
    const form = document.getElementById('dogForm');
    const statusMessage = document.getElementById('statusMessage');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const newDog = {
        name: document.getElementById('name').value,
        breed: document.getElementById('breed').value || null,
        weight_kg: document.getElementById('weight_kg').value ? parseFloat(document.getElementById('weight_kg').value) : null,
        birth_date: document.getElementById('birth_date').value || null,
        gender: document.getElementById('gender').value || null,
        chip_number: document.getElementById('chip_number').value || null,
        reg_number: document.getElementById('reg_number').value || null
      };

      const { error } = await supabaseClient
        .from('dogs')
        .insert([newDog]);

      if (error) {
        statusMessage.className = 'mt-4 alert alert-error text-sm py-2 rounded-xl text-white';
        statusMessage.textContent = 'Det oppstod en feil: ' + error.message;
        statusMessage.classList.remove('hidden');
      } else {
        statusMessage.className = 'mt-4 alert alert-success text-sm py-2 rounded-xl text-slate-800 bg-emerald-50 border border-emerald-200';
        statusMessage.textContent = `${newDog.name} ble lagret.`;
        statusMessage.classList.remove('hidden');
        
        form.reset();
        await loadDogs();
      }
    });

    // SLETT HUND
    async function deleteDog(id, name) {
      if (!confirm(`Er du sikker på at du vil slette ${name}?`)) return;

      const { error } = await supabaseClient
        .from('dogs')
        .delete()
        .eq('id', id);

      if (error) {
        alert('Feil ved sletting: ' + error.message);
      } else {
        await loadDogs();
      }
    }

    // ÅPNE REDIGERINGS-MODAL
    function openEditModal(id) {
      const dog = currentDogs.find(d => d.id === id);
      if (!dog) return;

      document.getElementById('edit_id').value = dog.id;
      document.getElementById('edit_name').value = dog.name || '';
      document.getElementById('edit_breed').value = dog.breed || '';
      document.getElementById('edit_weight_kg').value = dog.weight_kg || '';
      document.getElementById('edit_birth_date').value = dog.birth_date || '';
      document.getElementById('edit_gender').value = dog.gender || '';
      document.getElementById('edit_chip_number').value = dog.chip_number || '';
      document.getElementById('edit_reg_number').value = dog.reg_number || '';

      document.getElementById('editModal').showModal();
    }

    // OPPDATER HUND
    const editDogForm = document.getElementById('editDogForm');
    editDogForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const id = document.getElementById('edit_id').value;
      const updatedDog = {
        name: document.getElementById('edit_name').value,
        breed: document.getElementById('edit_breed').value || null,
        weight_kg: document.getElementById('edit_weight_kg').value ? parseFloat(document.getElementById('edit_weight_kg').value) : null,
        birth_date: document.getElementById('edit_birth_date').value || null,
        gender: document.getElementById('edit_gender').value || null,
        chip_number: document.getElementById('edit_chip_number').value || null,
        reg_number: document.getElementById('edit_reg_number').value || null
      };

      const { error } = await supabaseClient
        .from('dogs')
        .update(updatedDog)
        .eq('id', id);

      if (error) {
        alert('Feil ved oppdatering: ' + error.message);
      } else {
        document.getElementById('editModal').close();
        await loadDogs();
      }
    });

    // REGISTRER SERVICE WORKER (FOR PWA)
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then((reg) => console.log('Service Worker registrert:', reg.scope))
          .catch((err) => console.log('Service Worker-feil:', err));
      });
    }

    // Hent hundene ved oppstart
    loadDogs();
  </script>
</body>
</html>
